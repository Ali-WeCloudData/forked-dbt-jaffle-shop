models:
  - name: fct_orders
    description: Order fact table, offering key details for each order including a food vs. drink breakdown and order-level cost. One row per order.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_items_subtotal = subtotal"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_total = subtotal + tax_paid"
    columns:
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: subtotal
        description: The pre-tax total of the order in USD.
      - name: tax_paid
        description: The tax charged on the order in USD.
      - name: order_total
        description: The total amount of the order in USD, including tax.
      - name: ordered_at
        description: "{{ doc('ordered_at') }}"
      - name: order_cost
        description: The sum of supply expenses to fulfil the order in USD.
      - name: order_items_subtotal
        description: The sum of the product prices of the order's items in USD (should equal subtotal).
      - name: count_order_items
        description: The number of order items in the order.
      - name: count_food_items
        description: The number of food items in the order.
      - name: count_drink_items
        description: The number of drink items in the order.
      - name: is_food_order
        description: A boolean indicating if this order included any food items.
      - name: is_drink_order
        description: A boolean indicating if this order included any drink items.

  - name: fct_order_items
    description: |
      Order item fact table. One enriched row per order item, with its product
      details and per-product supply cost.
    columns:
      - name: order_item_id
        description: "{{ doc('order_item_id') }}"
        data_tests:
          - not_null
          - unique
      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "{{ doc('product_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: ordered_at
        description: "{{ doc('ordered_at') }}"
      - name: product_name
        description: The name of the product ordered.
      - name: product_price
        description: The price of the product in USD (this item's revenue).
      - name: is_food_item
        description: A boolean indicating if this order item is a food item.
      - name: is_drink_item
        description: A boolean indicating if this order item is a drink item.
      - name: supply_cost
        description: The total supply cost for this item's product in USD.

  - name: dim_customers
    description: Customer dimension table, offering key details for each unique customer. One row per customer.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "lifetime_spend_pretax + lifetime_tax_paid = lifetime_spend"
    columns:
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - not_null
          - unique
      - name: customer_name
        description: The customer's full name.
      - name: count_lifetime_orders
        description: Total number of orders the customer has ever placed.
      - name: first_ordered_at
        description: The timestamp when the customer placed their first order.
      - name: last_ordered_at
        description: The timestamp of the customer's most recent order.
      - name: lifetime_spend_pretax
        description: The sum of all the pre-tax subtotals of every order the customer has placed (USD).
      - name: lifetime_tax_paid
        description: The sum of all the tax paid across every order the customer has placed (USD).
      - name: lifetime_spend
        description: The sum of all order totals (including tax) the customer has ever placed (USD).
      - name: customer_type
        description: Either 'new' or 'returning', indicating whether the customer has placed more than one order.
        data_tests:
          - accepted_values:
              arguments:
                values: ["new", "returning"]

  - name: dim_products
    description: |
      Product dimension table. One row per product.
    columns:
      - name: product_id
        description: "{{ doc('product_id') }}"
        data_tests:
          - not_null
          - unique
      - name: product_name
        description: The name of the product.
      - name: product_type
        description: The category of the product (e.g. jaffle, beverage).
      - name: product_description
        description: A free-text description of the product.
      - name: product_price
        description: The price of the product in USD.
      - name: is_food_item
        description: A boolean indicating if the product is a food item.
      - name: is_drink_item
        description: A boolean indicating if the product is a drink item.

unit_tests:
  - name: test_order_items_compute_to_bools_correctly
    description: "Test that the counts of drinks and food orders convert to booleans properly."
    model: fct_orders
    # fct_orders is incremental; test the full-refresh code path so the unit test
    # doesn't depend on the already-built table existing.
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('fct_order_items')
        rows:
          - {order_id: 1, order_item_id: 1, is_drink_item: false, is_food_item: true}
          - {order_id: 1, order_item_id: 2, is_drink_item: true, is_food_item: false}
          - {order_id: 2, order_item_id: 3, is_drink_item: false, is_food_item: true}
      - input: ref('stg_orders')
        rows:
          - {order_id: 1}
          - {order_id: 2}
    expect:
      rows:
        - {order_id: 1, count_food_items: 1, count_drink_items: 1, is_drink_order: true, is_food_order: true}
        - {order_id: 2, count_food_items: 1, count_drink_items: 0, is_drink_order: false, is_food_order: true}
