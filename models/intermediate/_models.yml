models:
  - name: int_supplies_cost_per_product
    description: >
      Intermediate model that rolls the fluctuating per-supply costs up to a
      single supply cost per product, so the order-items fact can join it 1:1.
      Depends only on staging. Materialized as a view in the dev_intermediate schema.
    columns:
      - name: product_id
        description: "{{ doc('product_id') }}"
      - name: supply_cost
        description: The total supply cost for the product, summed across its supply rows (USD).

unit_tests:
  - name: test_supply_costs_sum_correctly
    description: "Test that supply costs are summed correctly to one cost per product."
    model: int_supplies_cost_per_product
    given:
      - input: ref('stg_supplies')
        rows:
          - {product_id: 1, supply_cost: 4.50}
          - {product_id: 2, supply_cost: 3.50}
          - {product_id: 2, supply_cost: 5.00}
    expect:
      rows:
        - {product_id: 1, supply_cost: 4.50}
        - {product_id: 2, supply_cost: 8.50}
