# Snapshot: SCD Type 2 history for orders.
# Built from the SAME source the incremental fct_orders model is built from
# (ecom.raw_orders), so the two can be compared side by side:
#   - fct_orders (incremental, merge) keeps only the CURRENT state of each order.
#   - orders_snapshot keeps the FULL HISTORY of every change to each order.
#
# Strategy "check": dbt compares the check_cols on each run; when a tracked
# column changes for an existing order, the old row is closed (dbt_valid_to is
# set) and a new current row is written. New orders simply get a new record.
# Run with `dbt snapshot` (also runs as part of `dbt build`).

snapshots:
  - name: orders_snapshot
    relation: source('ecom', 'raw_orders')
    config:
      schema: snapshots
      unique_key: id
      strategy: check
      check_cols: all
